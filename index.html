<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport strategy (do not "simplify" - each side is load-bearing):
         - The STATIC tag carries maximum-scale=1 because iOS browsers (Safari AND
           Chrome-on-iOS) only reliably honor the cap when it is present at parse time;
           it exists purely to stop the auto-zoom on focused inputs under 16px. iOS has
           ignored maximum-scale for USER pinch-zoom since iOS 10, so zooming still works.
         - The script REMOVES the cap on every non-iOS platform (Android honors dynamic
           viewport changes) because a capped viewport blocks Android pinch-zoom - a WCAG
           2.1 AA violation and a standard ADA-lawsuit-scanner finding. Runtime scanners
           therefore see a clean viewport. Touch-capable "Mac" UA = modern iPad. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- External (not inline) because script-src carries no 'unsafe-inline'/hashes: the
         CSP was silently blocking the inline version in production, which disabled the
         Android zoom-cap removal. Parse-blocking on purpose - it must edit the viewport
         meta before rendering, same timing as the inline version had. -->
    <script src="/viewport-fix.js"></script>
    <title>Winnbell - Shop Local. Win Cash Prizes</title>
    <meta name="description" content="Turn everyday shopping into chances to win real cash prizes. Earn entries through participating businesses or claim your weekly entry today. No purchase necessary." />

    <!-- ── Social sharing (Open Graph / Twitter) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Winnbell" />
    <meta property="og:title" content="Winnbell - Shop Local. Win Cash Prizes." />
    <meta property="og:description" content="Turn everyday shopping into chances to win real cash prizes. Earn entries through participating businesses or claim your weekly entry today. No purchase necessary." />
    <meta property="og:url" content="https://www.winnbell.com/" />
    <!-- Share preview = the brand icon. Referenced by THIS filename (not the old
         winnbell_logo.png) on purpose: WhatsApp/Facebook cache previews by image URL,
         and the old URL is cached with the ugly raw mark for weeks. -->
    <meta property="og:image" content="https://www.winnbell.com/winnbell_icon_512.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Winnbell - Shop Local. Win Cash Prizes." />
    <meta name="twitter:description" content="Turn everyday shopping into chances to win real cash prizes. Earn entries through participating businesses or claim your weekly entry today. No purchase necessary." />
    <meta name="twitter:image" content="https://www.winnbell.com/winnbell_icon_512.png" />

    <!-- ── Structured data: lets Google show the brand name/logo for "winnbell" searches.
         type=application/ld+json is a data block (never executed), so strict CSP allows it.
         logo must be the blue-tile icon, NOT winnbell_logo.png: Google renders this image as
         the search-result site icon, and the raw black mark on transparent shows as a black
         W in a white circle. ── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Winnbell",
        "url": "https://www.winnbell.com/",
        "logo": "https://www.winnbell.com/winnbell_icon_512.png",
        "email": "support@winnbell.com"
      }
    </script>

    <!-- ── PWA / Icons ── -->
    <!-- Real favicon-sized assets: Google search needs a small square icon - pointing this
         at the 1200px logo made results fall back to the generic globe. favicon.ico exists
         in public/ so the bare /favicon.ico probe gets an icon, not the SPA's index.html.
         Hyphenated filenames are deliberate NEW URLs (renamed 2026-09-02): Google's favicon
         store held a stuck 404 record for the www host from the 1200px-logo era, and a
         recrawl of unchanged URLs never re-evaluates it - do not rename these back. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/winnbell-favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/winnbell-favicon-192.png" />
    <!-- apple-touch stays SQUARE: iOS rounds home-screen icons itself and renders
         transparent corners as black, so it must not use the pre-rounded favicon. -->
    <link rel="apple-touch-icon" href="/winnbell_touch_192.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Winnbell" />

    <!-- ── Fonts (async — must not block first paint) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- media="print" defers apply; main.tsx flips it to 'all' on boot (no inline JS, CSP-safe) -->
    <link id="google-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Coiny&display=swap" media="print">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Coiny&display=swap"></noscript>

    <style>body { margin: 0; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
