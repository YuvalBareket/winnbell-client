<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops the iOS auto-zoom on focused inputs whose effective font size
         is under 16px (the zoomed auth forms shrink even 16px text below that threshold).
         iOS still allows user pinch-zoom regardless of this cap (accessibility, iOS 10+). -->
    <!-- Base viewport has NO maximum-scale: capping it blocks Android pinch-zoom, which
         is a WCAG 2.1 AA violation (and what ADA lawsuit scanners flag). The script below
         re-adds the cap on iOS ONLY, where it exists purely to stop Safari's auto-zoom on
         focused inputs under 16px: iOS has ignored maximum-scale for USER pinch-zoom since
         iOS 10, so accessibility is unharmed there. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Modern iPads report "Macintosh" in the UA (iPadOS 13+), so also treat any
      // touch-capable "Mac" as iPad.
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.userAgent.includes('Mac') && navigator.maxTouchPoints > 1)) {
        var wbViewport = document.querySelector('meta[name="viewport"]');
        if (wbViewport) wbViewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1');
      }
    </script>
    <title>Winnbell - Shop Local. Win Monthly Cash Prizes</title>
    <meta name="description" content="Turn everyday shopping into chances to win real monthly cash prizes. Earn entries through participating businesses or claim your weekly entry today. No purchase necessary." />

    <!-- ── Social sharing (Open Graph / Twitter) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Winnbell" />
    <meta property="og:title" content="Winnbell - Shop Local. Win Monthly Cash Prizes." />
    <meta property="og:description" content="Turn everyday shopping into chances to win real monthly cash prizes. Earn entries through participating businesses or claim your weekly entry today. No purchase necessary." />
    <meta property="og:url" content="https://www.winnbell.com/" />
    <!-- Share preview = the brand icon. Referenced by THIS filename (not the old
         winnbell_logo.png) on purpose: WhatsApp/Facebook cache previews by image URL,
         and the old URL is cached with the ugly raw mark for weeks. -->
    <meta property="og:image" content="https://www.winnbell.com/winnbell_icon_512.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Winnbell - Shop Local. Win Monthly Cash Prizes." />
    <meta name="twitter:description" content="Turn everyday shopping into chances to win real monthly cash prizes. Earn entries through participating businesses or claim your weekly entry today. No purchase necessary." />
    <meta name="twitter:image" content="https://www.winnbell.com/winnbell_icon_512.png" />

    <!-- ── Structured data: lets Google show the brand name/logo for "winnbell" searches.
         type=application/ld+json is a data block (never executed), so strict CSP allows it. ── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Winnbell",
        "url": "https://www.winnbell.com/",
        "logo": "https://www.winnbell.com/winnbell_logo.png",
        "email": "support@winnbell.com"
      }
    </script>

    <!-- ── PWA / Icons ── -->
    <link rel="icon" type="image/png" href="/winnbell_app_icon.png" />
    <link rel="apple-touch-icon" href="/winnbell_app_icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Winnbell" />

    <!-- ── Fonts (async — must not block first paint) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- media="print" defers apply; main.tsx flips it to 'all' on boot (no inline JS, CSP-safe) -->
    <link id="google-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Coiny&display=swap" media="print">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Coiny&display=swap"></noscript>

    <style>body { margin: 0; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
