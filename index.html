<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops the iOS auto-zoom on focused inputs whose effective font size
         is under 16px (the zoomed auth forms shrink even 16px text below that threshold).
         iOS still allows user pinch-zoom regardless of this cap (accessibility, iOS 10+). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Winnbell</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── PWA / Icons ── -->
    <link rel="icon" type="image/png" href="/winnbell_app_icon.png" />
    <link rel="apple-touch-icon" href="/winnbell_app_icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Winnbell" />

    <!-- ── Fonts (async — must not block first paint) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Coiny&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Coiny&display=swap"></noscript>

    <style>body { margin: 0; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
